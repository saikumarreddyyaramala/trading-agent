# Paper trading: simulated money. This is the default environment.
environment: paper

broker:
  paper: true

# Paper gathers data faster: up to 3 trades a day, held at the same time (ADR 0015).
# Live stays at 1 trade and 1 position; the config refuses anything more for live.
risk:
  max_trades_per_day: 3
  max_open_positions: 3

# Paper is for collecting data: the analyst takes the best available setup unless there is
# a clear reason not to. Risk checks, the trade score, and the critic still decide. Live
# money always uses the strict analyst (the config refuses anything else).
analyst:
  stance: gather_data

# 2026-10-21: the critic is off on paper, so the analyst's pick goes straight to the
# code-enforced risk checks and trade score, which still decide. Set true to turn it back
# on. Live money always keeps the critic (the config refuses false).
critic:
  enabled: false
