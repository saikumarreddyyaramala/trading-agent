# Base configuration shared by every environment.
# Environment files (paper.yaml, live.yaml) override these values.
# Secrets (API keys) never go here: they come from environment variables or a secrets manager.

environment: paper

# Emergency stop. When true, the agent may research and report but never places orders.
kill_switch: false

schedule:
  timezone: America/New_York
  data_collection: "08:30"
  analysis: "08:45"
  trade_window_start: "09:45"
  trade_window_end: "15:30"
  force_close: "15:50"
  report: "16:15"

risk:
  max_trades_per_day: 1
  max_position_usd: 50
  stop_loss_pct: 5
  take_profit_pct: 10
  account_floor_usd: 70
  min_price_usd: 5
  min_avg_daily_volume: 1000000
  allowed_exchanges: [NYSE, NASDAQ]
  max_price_deviation_pct: 2
  max_data_age_seconds: 300
  max_spread_pct: 0.5            # bid/ask spread as % of mid
  exclude_funds: true           # no funds, ETFs/ETNs, leveraged or inverse products
  volume_lookback_days: 20      # trading days averaged for min_avg_daily_volume

# To switch vendors, change this block only. Example for Claude:
#   provider: anthropic, model: claude-sonnet-5-5, fallback_model: claude-haiku-5-5
llm:
  provider: openai
  model: gpt-6.1-sol          # primary: agentic and multi-step work
  fallback_model: gpt-6-luna  # cheaper backup if the primary is unavailable
  reasoning_effort: medium    # none | minimal | low | medium | high | xhigh | max
  max_tokens: 4096
  timeout_seconds: 60
  max_retries: 2

broker:
  provider: alpaca
  paper: true

market_data:
  provider: alpaca
  quote_feed: iex             # real-time quotes: iex (free) | sip (paid) | delayed_sip
  bars_feed: sip              # daily bars: sip covers all exchanges (free if >15 min old)
  daily_bars: 30              # trading days of history per symbol
  news_lookback_hours: 24
  max_news_articles: 50       # per collection run
  news_per_symbol: 5

# Read-only research tools exposed to AI agents (MCP server and in-process).
tools:
  max_calls_per_session: 100  # stops a looping agent from hammering the data provider

# Analyst agent: researches with the tools above and proposes one trade or none.
# Hitting any limit ends the run with no trade.
analyst:
  max_turns: 15               # LLM round trips per run
  max_tool_calls_per_turn: 8
  max_total_tokens: 300000    # cost ceiling per run (input + output)
  repair_attempts: 1          # chances to fix an answer that fails the evidence checks

# Critic: a second LLM reviews every buy proposal against the exact tool outputs.
# It can only veto. Any critic failure means no trade.
critic:
  enabled: true
  model: null                 # e.g. a different model for an independent view; null = analyst's
  repair_attempts: 1
  max_evidence_chars: 60000

# Order execution (paper only until Phase 11). Exits are managed in code: a protective stop
# goes on right after the entry fills; take-profit and the force-close run in `manage`.
execution:
  entry_timeout_seconds: 120  # unfilled part of the entry limit order is cancelled after this
  poll_interval_seconds: 2
  max_decision_age_seconds: 60  # a risk approval older than this is refused as stale
  cancel_timeout_seconds: 30

# Audit trail (PostgreSQL; SQLite works locally). The URL comes from DATABASE_URL.
storage:
  required: false             # true = no audit record, no trade. live.yaml sets true.

# Daily cycle (`trading-agent run`). Step times come from `schedule` above.
orchestration:
  manage_interval_seconds: 60     # how often open positions are managed
  early_close_buffer_minutes: 10  # on half-days, force-close this long before the close
  close_settle_seconds: 30        # wait before verifying the account is flat

# Daily report, written after the close (and on demand: `trading-agent report`).
reporting:
  benchmark_symbol: SPY       # trades are compared with its open-to-close move that day
  output_dir: reports         # one Markdown and one JSON file per day
  history_days: 365           # window for the performance-to-date section

# Go/no-go bar for live trading (ADR 0011), fixed in advance. `trading-agent evaluate`
# scores the paper record against it. Every criterion must pass; missing data is a fail.
evaluation:
  min_cycle_days: 40             # about two months of daily cycles
  min_closed_trades: 20
  min_win_rate_pct: 45
  min_mean_excess_pct: 0         # mean return per trade minus SPY's same-day move
  min_excess_ci_lower_pct: -0.5  # lower end of the 90% bootstrap interval of that mean
  max_drawdown_usd: 15           # half of the $30 cushion above the $70 equity floor
  max_error_day_pct: 5
  max_llm_cost_per_day_usd: 1.00 # needs costs.llm_prices for every model used
  bootstrap_samples: 5000

# Self-learning (ADR 0013): after each day a reviewer turns results into short lessons the
# analyst reads the next morning. Lessons are advisory and can never change a rule or limit.
learning:
  enabled: true
  max_new_per_day: 2
  max_active: 15              # older lessons are retired when newer ones arrive
  lesson_ttl_days: 60         # a lesson expires unless it is learned again
  repair_attempts: 1

# What running the system costs (ADR 0014). See it with `trading-agent costs`. Nothing is
# guessed: a model with no price shows tokens only, and totals that include it are unknown.
costs:
  # USD per million tokens, from your provider's price page. Example:
  #   gpt-6.1-sol: {input: 2.50, output: 10.00}
  llm_prices: {}
  # Paid subscriptions, spread over every calendar day.
  services:
    - name: Alpaca paper trading and market data (free plan)
      monthly_usd: 0
  # New LLM calls are refused once today's priced spend reaches this (needs llm_prices).
  daily_llm_budget_usd: 2.00
