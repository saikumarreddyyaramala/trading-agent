# Live trading: REAL money.
# Loading this file is not enough to trade live. The process also needs
# LIVE_TRADING_CONFIRMED=true in its environment (a deliberate, separate switch).
environment: live

broker:
  paper: false

# Real money is never traded without an audit record.
storage:
  required: true

# Gates for real money, checked by `trading-agent live-check` and before every entry.
live:
  max_evaluation_age_days: 7     # the paper evaluation saying GO must be this recent
  max_account_equity_usd: 150    # refuse to run against a larger account
