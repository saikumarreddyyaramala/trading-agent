[project]
name = "trading-agent"
version = "0.1.0"
description = "Enterprise-style autonomous AI trading agent: research, risk-checked execution, full audit trail. Paper trading first."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.44",
    "anthropic>=1.15",
    "mcp>=2.3,<3",
    "openai>=2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
trading-agent = "trading_agent.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

# ---------- Lint & format ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # modern syntax
    "SIM",      # simplifications
    "S",        # security (bandit)
    "RUF",      # ruff-specific
    "PT",       # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

# ---------- Type checking ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["trading_agent"]

[[tool.mypy.overrides]]
module = ["alpaca.*"]
ignore_missing_imports = true

# ---------- Tests ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: talks to real external services (needs API keys; skipped in CI)",
    "paper_orders: places real orders on the Alpaca PAPER account (opt-in: RUN_PAPER_ORDERS=1)",
]

[tool.coverage.run]
source = ["trading_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
