# Local stack: PostgreSQL, a one-shot schema migration, then the daily trading cycle (PAPER).
#   docker compose up -d                       # start; the cycle runs every trading day
#   docker compose run --rm agent cycle-status # today's steps
#   docker compose run --rm agent flatten --confirm
services:
  agent:
    build: .
    command: ["run"]
    restart: unless-stopped  # a restart resumes the day without repeating finished steps
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@db:5432/trading
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["db", "upgrade"]
    environment:
      DATABASE_URL: postgresql://trading:trading@db:5432/trading
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading  # local development only
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
