# Local stack. `docker compose up` runs the agent's health check against your .env.
# PostgreSQL is included now so the stack matches production; the agent starts using it in Phase 6.
services:
  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@db:5432/trading
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading  # local development only
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
